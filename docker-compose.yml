services:
  catalog-db:
    container_name: ms_pg_catalog
    image: postgres:17
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_dev
    ports:
      - "5543:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - microservices-net
  keycloak:
    container_name: ms_keycloak
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
    ports:
      - "8181:8080"
    volumes:
      - keycloak-data:\opt\keycloak\data
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  catalog_data:
  keycloak-data: