services:
  catalog-db:
    container_name: ms_pg_catalog
    image: postgres:17
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog_dev
    ports:
      - "5543:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  catalog_data: